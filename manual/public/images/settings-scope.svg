<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
  <title id="title">設定の継承と個別指定</title>
  <desc id="desc">共通設定からサイト、板、タブへ設定を引き継ぎます。各段階で個別に指定した項目は、その指定が優先されます。</desc>
  <rect width="760" height="370" rx="16" fill="#f3f7fb"/>
  <g font-family="sans-serif" fill="#19334c">
    <g fill="#fff" stroke="#cddce9">
      <rect x="28" y="24" width="704" height="62" rx="8"/>
      <rect x="68" y="106" width="664" height="62" rx="8"/>
      <rect x="108" y="188" width="624" height="62" rx="8"/>
      <rect x="148" y="270" width="584" height="62" rx="8"/>
    </g>
    <g fill="#186aa8" font-size="20" font-weight="700">
      <text x="48" y="63">共通設定</text><text x="88" y="145">サイト設定</text>
      <text x="128" y="227">板別設定</text><text x="168" y="309">このタブだけ</text>
    </g>
    <g font-size="17">
      <text x="316" y="63">基本の値を指定する</text>
      <text x="316" y="145">引き継ぐ ／ サイトで上書き</text>
      <text x="316" y="227">引き継ぐ ／ 板で上書き</text>
      <text x="316" y="309">引き継ぐ ／ タブで変更</text>
    </g>
    <path d="M48 86v51h20m20 31v51h20m20 31v51h20" fill="none" stroke="#227bc4" stroke-width="3"/>
    <text x="28" y="355" fill="#526a7e" font-size="14">個別指定のない項目は上位の設定を引き継ぎます。</text>
  </g>
</svg>
