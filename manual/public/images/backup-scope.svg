<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
  <title id="title">設定のバックアップと環境全体の保管</title>
  <desc id="desc">設定のバックアップは設定や管理データ等をZIPに保存します。環境全体の保管ではSikiを終了し、プロファイルと、外部へ分けたログ・画像等の必要な保存先をコピーします。設定ZIPだけでログや画像をすべて保管したとは限りません。</desc>
  <rect width="640" height="650" rx="16" fill="#f3f7fb"/>
  <g font-family="sans-serif" fill="#19334c">
    <text x="28" y="44" font-size="26" font-weight="700">何を残すかで方法を選ぶ</text>
    <rect x="28" y="68" width="584" height="173" rx="10" fill="#fff" stroke="#cddce9"/>
    <text x="48" y="107" font-size="25" font-weight="700" fill="#186aa8">設定を戻すための控え</text>
    <text x="48" y="147" font-size="23">設定・管理データ・テーマ・プラグイン等</text>
    <path d="M320 163v24m-8-8 8 8 8-8" fill="none" stroke="#186aa8" stroke-width="3"/>
    <text x="320" y="220" text-anchor="middle" font-size="25" font-weight="700">設定のバックアップZIP</text>
    <rect x="28" y="263" width="584" height="286" rx="10" fill="#fff" stroke="#cddce9"/>
    <text x="48" y="303" font-size="25" font-weight="700" fill="#186aa8">ログ・画像も含めて環境を保管</text>
    <text x="48" y="340" font-size="23">保存先を確認し、Sikiを終了してからコピー</text>
    <rect x="48" y="362" width="258" height="82" rx="8" fill="#e8f2ff" stroke="#7da6cf"/>
    <rect x="334" y="362" width="258" height="82" rx="8" fill="#e4f3ef" stroke="#71a596"/>
    <g text-anchor="middle" font-size="23">
      <text x="177" y="394">プロファイル</text><text x="177" y="425" font-size="20">設定・内部の保存データ</text>
      <text x="463" y="394">外部に分けた保存先</text><text x="463" y="425" font-size="20">ログ・画像等（ある場合）</text>
    </g>
    <path d="M177 454v16h286v-16m-143 16v24m-8-8 8 8 8-8" fill="none" stroke="#186aa8" stroke-width="3"/>
    <text x="320" y="530" text-anchor="middle" font-size="25" font-weight="700">必要なデータを別の場所へ保管</text>
    <text x="28" y="590" font-size="23">ZIPだけで全ログ・画像が残るとは限りません。</text>
    <text x="28" y="624" font-size="21" fill="#526a7e">移行時は、新しいPCの保存先・参照パスも確認します。</text>
  </g>
</svg>
