<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img" aria-labelledby="title desc">
  <title id="title">未読と新着の違い</title>
  <desc id="desc">3番まで読み、5番まで取得済みの状態で更新し、6番から8番を取得した例です。更新直後、未読は4番から8番、新着は6番から8番です。</desc>
  <rect width="640" height="530" rx="16" fill="#f3f7fb"/>
  <g font-family="sans-serif" fill="#19334c">
    <text x="28" y="42" font-size="25" font-weight="700">更新直後の例</text>
    <text x="28" y="78" font-size="22">3番まで読み、5番まで取得済みの状態から更新</text>
    <rect x="28" y="103" width="584" height="82" rx="8" fill="#fff" stroke="#cddce9"/>
    <text x="48" y="137" font-size="25" font-weight="700">1〜3番：既読</text>
    <text x="48" y="167" font-size="22">読んだ位置までのレス</text>
    <path d="M28 205H612" stroke="#526a7e" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="196" y="188" width="248" height="34" rx="6" fill="#e2ebf3"/>
    <text x="320" y="213" text-anchor="middle" font-size="22">ここまで読んだ</text>
    <rect x="28" y="237" width="584" height="82" rx="8" fill="#e8f2ff" stroke="#7da6cf"/>
    <text x="48" y="271" font-size="25" font-weight="700">4〜5番：以前からの未読</text>
    <text x="48" y="301" font-size="22">取得済みで、まだ読んでいないレス</text>
    <rect x="28" y="337" width="584" height="82" rx="8" fill="#e4f3ef" stroke="#71a596"/>
    <text x="48" y="371" font-size="25" font-weight="700">6〜8番：今回の新着</text>
    <text x="48" y="401" font-size="22">更新で新しく取得し、まだ読んでいないレス</text>
    <rect x="28" y="443" width="584" height="62" rx="8" fill="#fff" stroke="#cddce9"/>
    <text x="320" y="482" text-anchor="middle" font-size="25" font-weight="700">未読：4〜8番　／　新着：6〜8番</text>
  </g>
</svg>
